name: Release VSIX

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: npm test
      - name: Run Extension Host integration tests
        run: xvfb-run -a npm run test:integration
      - name: Build VSIX
        run: npm run package -- --out "feishu-agent-notifier-${GITHUB_REF_NAME#v}.vsix"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          gh release upload "${GITHUB_REF_NAME}" \
            "feishu-agent-notifier-${GITHUB_REF_NAME#v}.vsix" --clobber
