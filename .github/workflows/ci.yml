name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run check-package

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Extension Host integration tests
        run: xvfb-run -a npm run test:integration
      - run: npm run package -- --out feishu-agent-notifier-ci.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: feishu-agent-notifier-vsix
          path: feishu-agent-notifier-ci.vsix
          if-no-files-found: error
